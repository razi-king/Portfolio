# Full stack locally:  docker compose up --build
# API:        http://localhost:8080/api/projects
# RabbitMQ:   http://localhost:15672  (guest / guest) — watch the retry & parking queues
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      RUN_WORKER: "false"
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      # Real email: set these in a local .env file (never commit it)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_TO: ${MAIL_TO:-raziinsane@gmail.com}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
